<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QA Automation</title>
    <script>
      try {
        var store = localStorage.getItem('arena-ui-storage');
        var theme = 'dark';
        if (store) {
          var state = JSON.parse(store).state;
          if (state && state.theme) {
            theme = state.theme;
          }
        }
        document.documentElement.setAttribute('data-theme', theme);
        var bg = theme === 'light' ? '#F6F8FC' : '#050507';
        document.write('<style>html, body, #root { background-color: ' + bg + '; }</style>');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
